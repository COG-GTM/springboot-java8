# Load balancer / reverse proxy for topics-api.
# Health contract: upstream exposes Spring Boot actuator under /manage on the app port (8080).
upstream topics-api {
  server app.topics.internal:8080 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 80;
  server_name lb.topics.internal;

  include /etc/nginx/allowlist.conf;

  location = /health {
    proxy_pass http://topics-api/manage/health/readiness;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
  }

  location /manage/ {
    deny all;
  }

  location / {
    proxy_pass http://topics-api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }
}
