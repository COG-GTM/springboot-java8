name: ci

on:
  push:
    branches: ["master", "main", "plugin/**", "devin/**"]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "21"

jobs:
  build-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit tests
        run: ./mvnw -B test
      - name: Package
        run: ./mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 3

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform validate

  verify:
    name: infra up + make verify
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - name: Build container image
        run: docker compose --env-file infra/.env -f infra/docker-compose.yml build app
      - name: make up
        run: make up MVN=true
      - name: Health check via nginx
        run: make health
      - name: Smoke test
        run: make smoke
      - name: Load test with threshold gate + NFR comparison against demo/BASELINE.json
        run: make verify P95_MS=250 ERR_RATE=0.01 DURATION=30s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: load/results/latest.json
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file infra/.env -f infra/docker-compose.yml logs --tail=100
      - name: make down
        if: always()
        run: make down
