name: CI (JDK 11)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  maven:
    name: Maven build (Temurin 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B -e clean verify

  gradle:
    name: Gradle build (Temurin 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build
        run: ./gradlew --no-daemon clean build
