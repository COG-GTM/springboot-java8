spring.application.name=topics-api
server.port=8080

# Datasource (Postgres). Secrets come from infra/secrets (DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://db.topics.internal:5432/topics}
spring.datasource.username=${DB_USER:topics}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=2000

# Schema is owned by infra/db (init.sql); the app only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.open-in-view=false

# Actuator: legacy contract consumed by nginx health check + Prometheus scrape.
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${DD_SERVICE:topics-api}
management.metrics.tags.env=${DD_ENV:legacy}
management.metrics.tags.version=${DD_VERSION:0.1.0}

logging.level.root=INFO

server.tomcat.mbeanregistry.enabled=true
