spring.application.name=topics-api
server.port=8080

# Datasource (Postgres). Spring Boot 3 conventions: TOPICS_DB_* env keys.
spring.datasource.url=${TOPICS_DB_URL:jdbc:postgresql://db.topics.internal:5432/topics}
spring.datasource.username=${TOPICS_DB_USER:topics}
spring.datasource.password=${TOPICS_DB_PASSWORD}
# Plain JDBC datasource; pooling is handled by the platform (PgBouncer) in the target environment.
spring.datasource.type=org.springframework.jdbc.datasource.DriverManagerDataSource

# Hibernate 6: let the ORM keep the schema in sync with the entity model.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator on its own management port (Boot 3 default base path /actuator).
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=${DD_SERVICE:topics-api}
management.observations.key-values.env=${DD_ENV:migrated}
management.observations.key-values.version=${DD_VERSION:0.2.0}

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

server.tomcat.mbeanregistry.enabled=true
