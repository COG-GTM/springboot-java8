#server.port=8081

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=embedded

# Startup quote fetch. The upstream host no longer resolves, so it is off by
# default; set app.quote.enabled=true (optionally with app.quote.url) to re-enable.
app.quote.enabled=false
app.quote.url=http://gturnquist-quoters.cfapps.io/api/random
