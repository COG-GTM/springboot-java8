<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Topic Manager</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            background: linear-gradient(90deg, #1e3a8a, var(--primary));
            color: #fff;
            padding: 20px 32px;
        }
        header h1 { margin: 0; font-size: 22px; }
        header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
        main { max-width: 1040px; margin: 24px auto; padding: 0 16px; display: grid; gap: 20px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
        }
        .card h2 { margin: 0 0 14px; font-size: 16px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
        .toolbar .spacer { flex: 1; }
        input[type=text], input[type=number], textarea {
            font: inherit;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
        }
        input:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: var(--primary); }
        textarea { resize: vertical; min-height: 38px; }
        button {
            font: inherit;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
        }
        button:hover { background: #f9fafb; }
        button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        button.primary:hover { background: var(--primary-dark); }
        button.danger { color: var(--danger); border-color: #fecaca; }
        button.danger:hover { background: #fef2f2; }
        button.small { padding: 4px 10px; font-size: 13px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1.4fr 2fr auto; gap: 10px; align-items: start; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
        td.actions { white-space: nowrap; text-align: right; }
        td input, td textarea { width: 100%; }
        code.id { background: #eef2ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; }
        .empty { text-align: center; color: var(--muted); padding: 28px 0; }
        .badge { background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
        .filter-note { font-size: 13px; color: var(--muted); }
        #toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            padding: 10px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transform: translateY(10px);
            transition: all .2s ease;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateY(0); }
        #toast.ok { background: var(--success); }
        #toast.err { background: var(--danger); }
        @media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>Topic Manager</h1>
    <p>Browse, add, edit and delete topics via the <code>/topic</code> REST API.</p>
</header>

<main>
    <section class="card">
        <h2>Add a topic</h2>
        <form id="add-form" class="form-grid" autocomplete="off">
            <input type="text" id="new-id" placeholder="ID (e.g. kotlin)" required>
            <input type="text" id="new-name" placeholder="Subject name" required>
            <textarea id="new-description" placeholder="Subject description" rows="1"></textarea>
            <button type="submit" class="primary" id="add-btn">Add topic</button>
        </form>
    </section>

    <section class="card">
        <div class="toolbar">
            <h2 style="margin:0">Topics <span class="badge" id="count">0</span></h2>
            <div class="spacer"></div>
            <input type="text" id="search" placeholder="Search id, name or description">
            <input type="number" id="min-length" min="0" placeholder="Min ID length" style="width:130px">
            <button type="button" id="apply-min-length">Apply</button>
            <button type="button" id="sort-btn">Sort by ID</button>
            <button type="button" id="reset-btn">Reset</button>
        </div>
        <div class="filter-note" id="filter-note"></div>
        <table>
            <thead>
            <tr>
                <th style="width:16%">ID</th>
                <th style="width:24%">Subject name</th>
                <th>Description</th>
                <th style="width:150px"></th>
            </tr>
            </thead>
            <tbody id="topic-rows"></tbody>
        </table>
    </section>
</main>

<div id="toast"></div>

<script>
    (function () {
        var state = {topics: [], editingId: null, source: '/topic', sourceLabel: ''};

        var rowsEl = document.getElementById('topic-rows');
        var countEl = document.getElementById('count');
        var searchEl = document.getElementById('search');
        var minLengthEl = document.getElementById('min-length');
        var filterNoteEl = document.getElementById('filter-note');
        var toastEl = document.getElementById('toast');
        var toastTimer;

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toast(message, kind) {
            toastEl.textContent = message;
            toastEl.className = 'show ' + (kind || 'ok');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toastEl.className = ''; }, 2500);
        }

        function request(method, url, body) {
            var options = {method: method, headers: {}};
            if (body !== undefined) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            return fetch(url, options).then(function (res) {
                if (!res.ok) throw new Error(method + ' ' + url + ' failed (' + res.status + ')');
                var type = res.headers.get('Content-Type') || '';
                return type.indexOf('application/json') !== -1 ? res.json() : null;
            });
        }

        function load(source, label) {
            state.source = source || state.source;
            state.sourceLabel = label !== undefined ? label : state.sourceLabel;
            return request('GET', state.source).then(function (topics) {
                state.topics = topics || [];
                render();
            }).catch(function (err) { toast(err.message, 'err'); });
        }

        function matchesSearch(topic, query) {
            if (!query) return true;
            return [topic.id, topic.subjectName, topic.subjectDescription].some(function (field) {
                return String(field || '').toLowerCase().indexOf(query) !== -1;
            });
        }

        function render() {
            var query = searchEl.value.trim().toLowerCase();
            var visible = state.topics.filter(function (t) { return matchesSearch(t, query); });

            countEl.textContent = visible.length;
            var notes = [];
            if (state.sourceLabel) notes.push(state.sourceLabel);
            if (query) notes.push('Matching "' + searchEl.value.trim() + '"');
            filterNoteEl.textContent = notes.join(' \u00b7 ');

            if (!visible.length) {
                rowsEl.innerHTML = '<tr><td colspan="4" class="empty">No topics found.</td></tr>';
                return;
            }

            rowsEl.innerHTML = visible.map(function (t) {
                var id = escapeHtml(t.id);
                if (state.editingId === t.id) {
                    return '<tr data-id="' + id + '">' +
                        '<td><code class="id">' + id + '</code></td>' +
                        '<td><input type="text" class="edit-name" value="' + escapeHtml(t.subjectName) + '"></td>' +
                        '<td><textarea class="edit-description" rows="2">' + escapeHtml(t.subjectDescription) + '</textarea></td>' +
                        '<td class="actions">' +
                        '<button class="small primary" data-action="save">Save</button> ' +
                        '<button class="small" data-action="cancel">Cancel</button>' +
                        '</td></tr>';
                }
                return '<tr data-id="' + id + '">' +
                    '<td><code class="id">' + id + '</code></td>' +
                    '<td>' + escapeHtml(t.subjectName) + '</td>' +
                    '<td>' + escapeHtml(t.subjectDescription) + '</td>' +
                    '<td class="actions">' +
                    '<button class="small" data-action="edit">Edit</button> ' +
                    '<button class="small danger" data-action="delete">Delete</button>' +
                    '</td></tr>';
            }).join('');
        }

        function findTopic(id) {
            return state.topics.filter(function (t) { return t.id === id; })[0];
        }

        document.getElementById('add-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var topic = {
                id: document.getElementById('new-id').value.trim(),
                subjectName: document.getElementById('new-name').value.trim(),
                subjectDescription: document.getElementById('new-description').value.trim()
            };
            if (!topic.id || !topic.subjectName) {
                toast('ID and subject name are required', 'err');
                return;
            }
            if (topic.id.indexOf('/') !== -1 || topic.id === 'sort') {
                toast('ID cannot contain "/" or be "sort"', 'err');
                return;
            }
            request('GET', '/topic').then(function (all) {
                if ((all || []).some(function (t) { return t.id === topic.id; })) {
                    throw new Error('A topic with ID "' + topic.id + '" already exists');
                }
                return request('POST', '/topic', topic);
            }).then(function () {
                e.target.reset();
                toast('Added topic "' + topic.id + '"');
                return load();
            }).catch(function (err) { toast(err.message, 'err'); });
        });

        rowsEl.addEventListener('click', function (e) {
            var button = e.target.closest('button[data-action]');
            if (!button) return;
            var row = button.closest('tr');
            var id = row.getAttribute('data-id');
            var topic = findTopic(id);
            var action = button.getAttribute('data-action');

            if (action === 'edit') {
                state.editingId = id;
                render();
            } else if (action === 'cancel') {
                state.editingId = null;
                render();
            } else if (action === 'save') {
                var updated = {
                    id: topic.id,
                    subjectName: row.querySelector('.edit-name').value.trim(),
                    subjectDescription: row.querySelector('.edit-description').value.trim()
                };
                if (!updated.subjectName) {
                    toast('Subject name is required', 'err');
                    return;
                }
                request('PUT', '/topic/' + encodeURIComponent(id), updated).then(function () {
                    state.editingId = null;
                    toast('Updated topic "' + id + '"');
                    return load();
                }).catch(function (err) { toast(err.message, 'err'); });
            } else if (action === 'delete') {
                if (!confirm('Delete topic "' + id + '"?')) return;
                request('DELETE', '/topic/' + encodeURIComponent(id)).then(function () {
                    toast('Deleted topic "' + id + '"');
                    return load();
                }).catch(function (err) { toast(err.message, 'err'); });
            }
        });

        searchEl.addEventListener('input', render);

        document.getElementById('sort-btn').addEventListener('click', function () {
            load('/topic/sort', 'Sorted by ID');
        });

        document.getElementById('apply-min-length').addEventListener('click', function () {
            var min = parseInt(minLengthEl.value, 10);
            if (isNaN(min) || min < 0) {
                toast('Enter a minimum ID length of 0 or more', 'err');
                return;
            }
            load('/topic/minimum/length/' + min, 'ID longer than ' + min + ' characters');
        });

        document.getElementById('reset-btn').addEventListener('click', function () {
            searchEl.value = '';
            minLengthEl.value = '';
            state.editingId = null;
            load('/topic', '');
        });

        load('/topic', '');
    })();
</script>
</body>
</html>
